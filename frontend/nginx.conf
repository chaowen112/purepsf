# Disk cache for OneMap raster tiles. ~30 day TTL, max 2 GB on disk.
proxy_cache_path /var/cache/nginx/onemap levels=1:2 keys_zone=onemap_tiles:10m
                 max_size=2g inactive=30d use_temp_path=off;

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't leak nginx version
    server_tokens off;

    # OneMap raster tiles, proxied + cached. Hides client IPs from OneMap and
    # keeps repeat tile fetches off their bandwidth.
    location /tiles/onemap/ {
        resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
        proxy_pass         https://www.onemap.gov.sg/maps/tiles/Default/;
        proxy_set_header   Host www.onemap.gov.sg;
        proxy_ssl_server_name on;
        proxy_cache        onemap_tiles;
        proxy_cache_valid  200 30d;
        proxy_cache_valid  404 1h;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock   on;
        add_header X-Cache-Status $upstream_cache_status;
        # Tell browsers to cache too.
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    # Stable app entry points are referenced by backend-rendered property
    # pages. Revalidate them on each visit; their imported chunks stay hashed.
    location = /assets/app.js {
        expires -1;
        try_files $uri =404;
    }
    location = /assets/app.css {
        expires -1;
        try_files $uri =404;
    }

    # Hashed asset bundles: cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy API and healthz to the backend container (Docker DNS).
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location = /healthz {
        proxy_pass http://backend:8080/healthz;
    }

    # SEO files — served by the Go backend so they're always in sync with the
    # current set of projects/subzones. Cloudflare cache will hold them.
    location = /robots.txt {
        proxy_pass http://backend:8080/robots.txt;
    }
    location = /sitemap.xml {
        proxy_pass http://backend:8080/sitemap.xml;
    }

    # RFC 9727 API discovery. Keep this at the origin so GET and HEAD expose
    # the same registered relation even when the site is served through the
    # CDN. The target is an RFC 9264 JSON Linkset built with the frontend.
    location = / {
        add_header Link '</.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json"' always;
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Link '</.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json"' always;
        try_files $uri =404;
    }
    location = /.well-known/api-catalog {
        default_type 'application/linkset+json; profile="https://www.rfc-editor.org/info/rfc9727"';
        add_header Link '</.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json"' always;
        try_files $uri =404;
    }

    # Property pages must be real server responses, not the SPA fallback.
    # The backend validates the id, redirects slug mismatches to the canonical
    # URL, and renders crawlable property + transaction HTML.
    location ^~ /p/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA: any non-asset, non-API request falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
