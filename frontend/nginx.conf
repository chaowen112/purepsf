server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't leak nginx version
    server_tokens off;

    # Hashed asset bundles: cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy API and healthz to the backend container (Docker DNS).
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location = /healthz {
        proxy_pass http://backend:8080/healthz;
    }

    # SPA: any non-asset, non-API request falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
