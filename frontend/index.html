        <main style="max-width:680px;margin:3rem auto;padding:0 1rem;font:14px/1.5 system-ui,sans-serif;color:#1e293b">
          <h1 style="font-size:1.4rem;margin-bottom:.5rem">purePSF — Singapore property transaction map</h1>
          <p>
            purePSF is an interactive map of real Singapore property transaction prices,
            built on URA private-sale data (2021–present), HDB resale data (1990–present),
            and CEA salesperson activity records. It needs JavaScript to render the map
            and charts.
          </p>
          <p>
            <strong>What you can do:</strong> click any project to see its PSF history,
            tenure and remaining lease, full transaction list, and a comparison against
            nearby properties. Click a planning subzone to see its monthly PSF trend
            and the most active agents in the surrounding planning area. The
            <a href="/agents">/agents</a> page ranks salespeople by town, property type
            and transaction side.
          </p>
          <p>
            <em>Independent project. Data sourced from URA, HDB and CEA under the
            <a href="https://www.ura.gov.sg/ms/eservices/Maps/acceptance-grant-licence">Singapore Open Data Licence</a>.
            Not affiliated with or endorsed by any government agency.</em>
          </p>
